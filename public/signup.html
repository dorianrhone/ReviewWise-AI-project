
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | ReviewWise AI</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="chatgpt-theme">

<main class="page-shell">
    <div class="page-container narrow">

        <a href="home.html" class="page-brand">
            ReviewWise AI
        </a>

        <div class="page-header">
            <div>
                <h1>Create your account</h1>
                <p class="page-subtitle">
                    Start turning customer feedback into better decisions.
                </p>
            </div>
        </div>

        <section class="rw-card">

            <div id="error-msg" class="rw-error" role="alert"></div>

            <form
                id="signup-form"
                class="rw-form"
                onsubmit="handleSignup(event)"
            >

                <label for="signup-name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="signup-name"
                    placeholder="John Doe"
                    autocomplete="name"
                    required
                >

                <label for="signup-email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="signup-email"
                    placeholder="name@company.com"
                    autocomplete="email"
                    required
                >

                <label for="signup-password">
                    Password
                </label>

                <input
                    type="password"
                    id="signup-password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

                <button type="submit" class="rw-primary-btn">
                    Create Account
                </button>

            </form>

            <p class="rw-form-footer">
                Already have an account?
                <a href="login.html">Sign In</a>
            </p>

        </section>

        <p class="rw-form-footer">
            <a href="home.html">← Back to ReviewWise AI</a>
        </p>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="scripts/auth.js" defer></script>

</body>
</html>
