<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - ReviewWise AI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="chatgpt-theme">

<main class="pricing-main" style="max-width: 440px;">  
  <div class="chat-header" style="margin-bottom: 20px;">
    <div>
      <h1>Create Account</h1>
      <p style="color: #9ca3af; margin: 4px 0 0 0;">Sign up to start using your ReviewWise AI workspace.</p>
    </div>
    <a href="home.html" class="nav-btn secondary">Back to App</a>
  </div>

  <section class="pricing-container">
    <div class="input-card" style="background: #212121; border: 1px solid #3f3f46; border-radius: 12px; padding: 24px;">
      
      <!-- Error Message Banner -->
      <div id="error-msg" style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 16px;"></div>

      <form id="signup-form" onsubmit="handleSignup(event)">
        <label for="signup-name">Full Name</label>
        <input type="text" id="signup-name" placeholder="John Doe" required style="margin-bottom: 16px;">

        <label for="signup-email">Email Address</label>
        <input type="email" id="signup-email" placeholder="name@company.com" required style="margin-bottom: 16px;">

        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" placeholder="••••••••" required style="margin-bottom: 24px;">

        <button type="submit" class="plan-btn primary" style="width: 100%; padding: 12px;">Create Account</button>
      </form>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="scripts/auth.js" defer></script>
</body>
</html>
