<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReviewWise AI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<main>  
  <div class="header-row">
    <div>
      <h1>ReviewWise AI</h1>
      <p>Turning Customer Reviews into Huge Business Insights.</p>
    </div>
    <div class="nav-links">
      <a href="pricing.html" class="nav-btn secondary">Pricing Plans</a>
      <a href="checkout.html" class="nav-btn primary">Checkout</a>
    </div>
  </div>

  <!-- Current Tier Display Banner -->
  <div id="tier-banner" class="tier-banner">
    <span>Active Tier: <strong id="active-tier-name">Free Tier ($0/mo)</strong></span>
    <a href="pricing.html" class="upgrade-link">Upgrade Plan</a>
  </div>

  <label for="reviews">Customer Reviews</label>
  <textarea id="reviews" rows="9" placeholder="Paste reviews here"></textarea>
  <button id="analyze">Analyze Reviews</button>
  <h2>Gemini Insights</h2>
  <pre id="answer" aria-live="polite">Results appear here.</pre>
  <label for="question">Ask a follow-up question</label>
  <input id="question" placeholder="What should we improve first?">
  <button id="ask">Ask Gemini</button>
</main>
<footer>
    <p>&copy; 2026 ReviewWise AI. All rights reserved.</p>
</footer>
<script src="home.js" defer></script>
</body>
</html>
