<!DOCTYPE html>
<html lang="en">
<head>

<body>
<main>  
<h1>ReviewWise AI</h1>
<p>Turning in Customer Reviews into Huge Business Insights.</p>
<label for="reviews">Customer Reviews</label>
<textarea id="reviews" rows="9" placeholder="Paste reviews here"></textarea>
<button id="analyze">Analyze Reviews</button>
<h2>Gemini Insights</h2>
<pre id="answer" aria-live="polite">Results appear here.</pre>
<label for="question">Ask a follow-up question</label>
<input id="question" placeholder="What should we improve first?">
<button id="ask">Ask Gemini</button>
</main>
