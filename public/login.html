
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | ReviewWise AI</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="chatgpt-theme">

<main class="page-shell">
    <div class="page-container narrow">

        <a href="home.html" class="page-brand">
            ReviewWise AI
        </a>

        <div class="page-header">
            <div>
                <h1>Welcome back</h1>
                <p class="page-subtitle">
                    Sign in to continue your business insights.
                </p>
            </div>
        </div>

        <section class="rw-card">

            <div id="error-msg" class="rw-error" role="alert">
                Invalid email or password. Please try again.
            </div>

            <form
                id="login-form"
                class="rw-form"
                onsubmit="handleLogin(event)"
            >

                <label for="login-email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="login-email"
                    placeholder="name@company.com"
                    autocomplete="email"
                    required
                >

                <label for="login-password">
                    Password
                </label>

                <input
                    type="password"
                    id="login-password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" class="rw-primary-btn">
                    Sign In
                </button>

            </form>

            <p class="rw-form-footer">
                Don't have an account?
                <a href="signup.html">Create one</a>
            </p>

        </section>

        <p class="rw-form-footer">
            <a href="home.html">← Back to ReviewWise AI</a>
        </p>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="scripts/auth.js" defer></script>

</body>
</html>
